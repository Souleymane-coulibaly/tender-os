<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="TenderOS — Plateforme intelligente de réponse aux appels d'offres">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A2A5B"/>
      <stop offset="1" stop-color="#0d3a7a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Icon mark, scaled ~3.5x from the 48x48 source -->
  <g transform="translate(100,120) scale(3.5)">
    <rect width="48" height="48" rx="10" fill="#123B7A"/>
    <polygon points="20,10 30,10 30,32 25,40 20,32" fill="#FFFFFF"/>
    <polygon points="30,10 40,10 30,22" fill="#D4AF37"/>
  </g>

  <text x="100" y="380" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="72" letter-spacing="-1">
    <tspan fill="#FFFFFF">Tender</tspan><tspan fill="#D4AF37">OS</tspan>
  </text>

  <text x="100" y="440" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="30" fill="#CBD5E1">
    Plateforme intelligente de réponse aux appels d'offres
  </text>

  <text x="100" y="500" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" letter-spacing="2" fill="#D4AF37">
    RÉPONDRE · COLLABORER · GAGNER
  </text>
</svg>
