services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tenderos
      POSTGRES_USER: tenderos
      POSTGRES_PASSWORD: tenderos_local
    ports:
      - "5432:5432"
    volumes:
      - tenderos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderos -d tenderos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tenderos_postgres:
